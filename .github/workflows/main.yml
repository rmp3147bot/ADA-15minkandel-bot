# .github/workflows/main.yml
name: REZA BOT - ALO Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (start|stop|status|logs)'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
          - status
          - logs

jobs:
  alo-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Create directories
      run: |
        mkdir -p logs pids
    
    - name: Run ALO Bot
      env:
        XT_API_KEY: ${{ secrets.XT_API_KEY }}
        XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
        XT_MARGIN_USDT: 4.0
        XT_LEVERAGE: 8
      run: |
        if [ "${{ github.event.inputs.command }}" == "start" ] || [ "${{ github.event.inputs.command }}" == "" ]; then
          echo "🚀 Starting ALO Bot..."
          python reza_bot_v50_7.txt &
          sleep 3
          python reza_execution_platform_v1.txt &
          sleep 3
          echo "✅ ALO System Started"
        elif [ "${{ github.event.inputs.command }}" == "stop" ]; then
          echo "🛑 Stopping ALO Bot..."
          pkill -f "reza_bot_v50_7.txt" || true
          pkill -f "reza_execution_platform_v1.txt" || true
          echo "✅ ALO System Stopped"
        elif [ "${{ github.event.inputs.command }}" == "status" ]; then
          echo "📊 ALO System Status:"
          ps aux | grep -E "reza_bot_v50_7|reza_execution_platform_v1" | grep -v grep || echo "No processes running"
        elif [ "${{ github.event.inputs.command }}" == "logs" ]; then
          echo "📋 Logs will be shown below:"
          tail -f logs/*.log 2>/dev/null || echo "No logs found"
        fi
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: alo-logs
        path: logs/
        retention-days: 7
    
    - name: Keep workflow alive
      if: github.event.inputs.command == 'start'
      run: |
        echo "⏳ Keeping workflow alive..."
        sleep 3600
